name: Prepara caroselli Instagram 10 ottobre
on:
  push:
    branches: [main]
    paths: ['.github/workflows/render-2026-10-10-instagram.yml']
permissions:
  contents: write
concurrency:
  group: render-instagram-2026-10-10
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'simociriello-dotcom/simoneciriello-blog' && github.actor == 'simociriello-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Disegna le dodici slide approvate
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/render-2026-10-10-instagram.py
      - name: Verifica i file JPEG e rendili pubblici
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          images = sorted(Path('assets/instagram/2026-10-10').rglob('*.jpg'))
          assert len(images) == 12, f'Attesi 12 JPEG, trovati {len(images)}'
          for item in images:
              with Image.open(item) as im:
                  assert im.size == (1080, 1080) and im.format == 'JPEG'
          print('12 immagini 1080x1080 verificate')
          PY
          git config user.name "Simone Editorial Bot"
          git config user.email "editorial-bot@users.noreply.github.com"
          git add assets/instagram/2026-10-10/
          git diff --cached --quiet && exit 0
          git commit -m "Render three approved Instagram carousels for 10 October"
          git pull --rebase origin main
          git push origin HEAD:main
