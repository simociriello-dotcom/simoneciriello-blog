---
layout: default
---
<article class="article">
  <p class="eyebrow">INSIGHTS / {{ page.date | date: '%d %B %Y' }}</p>
  <h1>{{ page.title }}</h1><p class="intro">{{ page.description }}</p>
  {% if page.image %}<img src="{{ page.image }}" alt="Copertina articolo {{ page.title | escape }}" loading="lazy"/>{% endif %}
  <div class="article-body">{{ content }}</div>
  <div class="after">Hai un e-commerce da sviluppare o migliorare? <a href="https://simoneciriello.it">Parliamone &rarr;</a></div>
</article>
